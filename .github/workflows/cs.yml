name: noema cs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: cs/proofs
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
      # Three modules peak near 8 GB each (measured 2026-11-01). Lake builds them side by side, which ran the
      # 16 GB runner out of memory ("lost communication with the server"). Build those one at a time, then the rest.
      - name: Build the heavy proofs one at a time
        working-directory: cs/proofs
        run: for m in FarCerts.BB3Tree FarCerts.Count2 FarCerts.BB23Tree; do lake build "$m"; done
      - name: Build the rest
        working-directory: cs/proofs
        run: lake build
