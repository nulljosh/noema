name: noema biology
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    working-directory: biology

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run evidna.py benchmark
      - run: uv run evidna.py export-demo && git diff --exit-code -- landing/results.json landing/study.json
