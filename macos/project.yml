name: Noema
options:
  bundleIdPrefix: com.heyitsmejosh
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Noema:
    type: application
    platform: macOS
    sources:
      - path: Noema
      - path: ../discoveries.json
        buildPhase: resources
      - path: ../ledger.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.noema
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Noema
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        CODE_SIGN_ENTITLEMENTS: Noema/Noema.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  NoemaiOS:
    type: application
    platform: iOS
    sources:
      - path: Noema
        excludes:
          - Noema.entitlements
      - path: ../discoveries.json
        buildPhase: resources
      - path: ../ledger.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.noema.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Noema
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  NoemaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Noema/Model.swift
      - path: Noema/Views.swift
      - path: Noema/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyitsmejosh.noema.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Noema:
    build:
      targets:
        Noema: all
        NoemaTests: [test]
    test:
      targets: [NoemaTests]
  NoemaiOS:
    build:
      targets:
        NoemaiOS: all
